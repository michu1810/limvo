version: 2

# Weekly update pull requests, grouped so a week brings at most one pull
# request per ecosystem. Security updates arrive on their own, as soon as an
# advisory is published. New versions wait a week before they are proposed, so
# a compromised release is usually pulled before it reaches this repository.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    # The types follow the Node version the project builds with (22, see
    # package.json engines and CI); newer majors describe APIs it lacks.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
