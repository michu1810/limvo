version: 2

# Weekly update pull requests, grouped so a week brings at most one pull
# request per ecosystem. Security updates arrive on their own, as soon as an
# advisory is published. New versions wait a week before they are proposed, so
# a compromised release is usually pulled before it reaches this repository.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
