name: Release

# Push a tag such as v0.2.0 to build the installer and draft a GitHub release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    # The release environment holds the signing secrets. It only accepts runs
    # from v* tags and waits for a maintainer's approval, so a branch workflow
    # or a pull request can never read them.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # No build caches here: a release is built from a clean state, so a
      # cache written by another run can never end up in a signed installer.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key. Its signature is redone below over the final,
          # Authenticode-signed installer, so the feed is written there too.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Limvo ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed in this version.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      # Code signing through SignPath Foundation. Skipped until the repository
      # variables in docs/CODE-SIGNING.md are set, so forks build unsigned.
      - name: Collect the installer for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: limvo-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: src-tauri/target/release/bundle/nsis

      - name: Replace the draft installer with the signed one
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($installer in Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) {
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne "Valid") { throw "$($installer.Name) is not signed: $($signature.Status)" }
            gh release upload "${{ github.ref_name }}" $installer.FullName --clobber
          }

      # Installed copies check latest.json of the newest published release and
      # verify the installer against the public key in tauri.conf.json. The
      # signature must cover the exact file people download, so it is made
      # here, after Authenticode signing changed the installer's bytes.
      - name: Sign the update and publish the feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match version $version" }
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          $installer = $installer[0]
          Remove-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          npx tauri signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing the update failed" }
          $feed = [ordered]@{
            version   = $env:TAG.TrimStart("v")
            notes     = "See CHANGELOG.md for what changed in this version."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$($installer.Name)"
              }
            }
          }
          $feed | ConvertTo-Json -Depth 4 | Set-Content -Path latest.json -Encoding utf8NoBOM
          gh release upload $env:TAG "$($installer.FullName).sig" latest.json --clobber

      - name: Publish checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $lines = $installers | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
