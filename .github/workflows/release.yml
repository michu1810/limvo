name: Release

# Push a tag such as v0.2.0 to build the installer and draft a GitHub release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    # The release environment holds the signing secrets. It only accepts runs
    # from v* tags and waits for a maintainer's approval, so a branch workflow
    # or a pull request can never read them.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checked first, so a mistyped tag fails before anyone approves a
      # signing request.
      - name: Check the tag against the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match version $version" }

      # No build caches here: a release is built from a clean state, so a
      # cache written by another run can never end up in a signed installer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # The app and its installer are built in two steps, so limvo.exe can be
      # signed in between: the installer then carries the signed app.
      - name: Build the app
        run: npx tauri build --no-bundle --ci

      # The bundler normally writes the bundle type into the app, which the
      # updater reads. Writing it into a signed file would break the
      # signature, so it is written here, before signing, and the bundle step
      # below runs with --no-binary-patching.
      - name: Mark the app as an NSIS install
        shell: pwsh
        run: |
          $path = "src-tauri/target/release/limvo.exe"
          $bytes = [IO.File]::ReadAllBytes($path)
          # ISO-8859-1 maps every byte to one character, so the string index
          # is the byte offset.
          $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
          $index = $text.IndexOf("__TAURI_BUNDLE_TYPE_VAR_UNK", [StringComparison]::Ordinal)
          if ($index -lt 0) { throw "bundle type marker not found in $path" }
          $nsis = [Text.Encoding]::ASCII.GetBytes("__TAURI_BUNDLE_TYPE_VAR_NSS")
          [Array]::Copy($nsis, 0, $bytes, $index, $nsis.Length)
          [IO.File]::WriteAllBytes($path, $bytes)

      # Code signing through SignPath Foundation. Skipped until the variables
      # in docs/CODE-SIGNING.md are set, so forks build unsigned. Each release
      # sends two requests, the app and then the installer, because the
      # installer can only be built once the app inside it is signed.
      - name: Collect the app for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limvo-app-unsigned
          path: src-tauri/target/release/limvo.exe
          if-no-files-found: error

      - name: Sign the app
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: src-tauri/target/release

      - name: Check the app's signature
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature src-tauri/target/release/limvo.exe
          if ($signature.Status -ne "Valid") { throw "limvo.exe is not signed: $($signature.Status)" }

      # The Microsoft Store package carries the same app, signed when signing
      # is on. The Store signs the package itself, so it is kept as a workflow
      # artifact for upload in Partner Center, never attached to the release:
      # nobody could install it from there. Skipped until the identity
      # variables in docs/MICROSOFT-STORE.md are set.
      - name: Pack the Microsoft Store package
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: >-
          ./scripts/pack-msix.ps1
          -IdentityName $env:IDENTITY_NAME
          -Publisher $env:PUBLISHER
          -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME

      - name: Keep the Microsoft Store package
        if: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limvo-msix
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error

      # The updater key must be present because createUpdaterArtifacts is on.
      # The signature made here is redone below over the final installer.
      - name: Build the installer
        run: npx tauri bundle --bundles nsis --no-binary-patching --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect the installer for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limvo-installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Sign the installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: src-tauri/target/release/bundle/nsis

      - name: Check the installer's signature
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          foreach ($installer in Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) {
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne "Valid") { throw "$($installer.Name) is not signed: $($signature.Status)" }
          }

      # Installed copies check latest.json of the newest published release and
      # verify the installer against the public key in tauri.conf.json. The
      # signature must cover the exact file people download, so it is made
      # here, after Authenticode signing changed the installer's bytes.
      - name: Sign the update and write the feed
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw "expected one installer, found $($installer.Count)" }
          $installer = $installer[0]
          Remove-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
          npx tauri signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing the update failed" }
          $feed = [ordered]@{
            version   = $env:TAG.TrimStart("v")
            notes     = "See CHANGELOG.md for what changed in this version."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$($installer.Name)"
              }
            }
          }
          $feed | ConvertTo-Json -Depth 4 | Set-Content -Path latest.json -Encoding utf8NoBOM

      - name: Write checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $lines = $installers | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii

      # Published last, with every file at once, so a failed or rejected
      # signing request leaves no half-finished release behind. Publishing is
      # what installed copies see: the maintainer's approval of this run is
      # the release decision. The notes are the version's CHANGELOG section.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $changelog = (Get-Content CHANGELOG.md -Raw) -replace "`r`n", "`n"
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $version" }
          $notes = $section.Groups[1].Value.Trim() + "`n`n---`n`nCode signing policy: https://github.com/${{ github.repository }}#code-signing-policy"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8NoBOM
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          gh release create $env:TAG --verify-tag --latest `
            --repo "${{ github.repository }}" `
            --title "Limvo $env:TAG" `
            --notes-file release-notes.md `
            $installer "$installer.sig" latest.json SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }

  # Sends the same package to the Microsoft Store, where it goes through
  # certification and then out to Store installs on its own. The Store API
  # can only update a product that is already live, so this stays off until
  # the repository variable MSSTORE_AUTOSUBMIT is "true" and the `store`
  # environment holds the Partner Center API credentials
  # (docs/MICROSOFT-STORE.md).
  store:
    name: Microsoft Store
    needs: windows
    if: ${{ vars.MSSTORE_AUTOSUBMIT == 'true' }}
    runs-on: windows-latest
    # Only v* tags may use this environment, and this job only runs after the
    # approved release job, so it needs no approval of its own.
    environment: store
    permissions: {}
    steps:
      - name: Download the Store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: limvo-msix
          path: msix

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Submit the package
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          # Limvo's Store product ID, public on its Store page.
          PRODUCT_ID: 9MZ7HN8V6GX5
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "configuring the Store CLI failed" }
          $package = @(Get-ChildItem msix/*.msix)
          if ($package.Count -ne 1) { throw "expected one package, found $($package.Count)" }
          # Starts a new submission from the live one, so the listing stays as
          # it is, swaps in this package and commits it for certification.
          # Given a .msix file as its path, the CLI publishes that package as
          # it is instead of looking for a project to build.
          msstore publish $package[0].FullName --appId $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "submitting to the Store failed" }
