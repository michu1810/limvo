<!doctype html>
<!--
  Microsoft Store screenshots, composed from the real interface.
  With `npm run dev` running, open /docs/store/scenes.html?s=1 (1 to 6).
  docs/store/render.mjs renders every scene at 3840x2160.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Limvo Store scene</title>
<style>
  :root {
    --ink: #f4f1ee;
    --ink-soft: rgba(244, 241, 238, 0.72);
    --accent: #e07a5f;
    --accent-deep: #c24f37;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d0b0a; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.light { --ink: #1d1a18; --ink-soft: rgba(29, 26, 24, 0.68); background: #efe9e3; }

  /* Wallpaper: soft light blooms in the brand colours, the way Windows 11 wallpapers glow. */
  .wall { position: absolute; inset: 0; overflow: hidden; }
  .wall::before, .wall::after, .wall i { content: ""; position: absolute; border-radius: 50%; filter: blur(120px); }
  .dark .wall { background: radial-gradient(120% 90% at 85% 110%, #2a1712 0%, #120e0d 55%, #0b0a0a 100%); }
  .dark .wall::before { width: 1100px; height: 900px; right: -200px; bottom: -380px; background: radial-gradient(circle, rgba(224, 122, 95, 0.55), rgba(194, 79, 55, 0) 70%); }
  .dark .wall::after { width: 900px; height: 700px; left: -260px; top: -320px; background: radial-gradient(circle, rgba(88, 101, 242, 0.28), rgba(88, 101, 242, 0) 70%); }
  .dark .wall i { width: 700px; height: 520px; left: 34%; top: 46%; background: radial-gradient(circle, rgba(52, 168, 140, 0.16), rgba(52, 168, 140, 0) 70%); }
  .light .wall { background: radial-gradient(120% 100% at 80% 100%, #f7d9cc 0%, #f1e8e1 50%, #ece7e2 100%); }
  .light .wall::before { width: 1100px; height: 900px; right: -220px; bottom: -420px; background: radial-gradient(circle, rgba(224, 122, 95, 0.45), rgba(224, 122, 95, 0) 70%); }
  .light .wall::after { width: 900px; height: 700px; left: -260px; top: -320px; background: radial-gradient(circle, rgba(120, 140, 255, 0.28), rgba(120, 140, 255, 0) 70%); }
  .light .wall i { display: none; }

  /* The desktop is a 1536x864 screen at 125%, so the interface reads at its real proportions. */
  .stage { position: absolute; left: 0; top: 0; width: 1536px; height: 864px; transform: scale(1.25); transform-origin: 0 0; }

  /* Windows 11 taskbar: 48px, Start and pinned apps on the left, tray and clock on the right. */
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center;
    font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  .dark .taskbar { background: rgba(30, 30, 30, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.06); color: #fff; --run: rgba(255, 255, 255, 0.5); --focus: #4cc2ff; --hover: rgba(255, 255, 255, 0.06); }
  .light .taskbar { background: rgba(238, 238, 238, 0.95); border-top: 1px solid rgba(0, 0, 0, 0.07); color: #1b1b1b; --run: rgba(0, 0, 0, 0.42); --focus: #005fb8; --hover: rgba(255, 255, 255, 0.7); }
  /* Left-aligned, as many people set it: the centred layout collides with a wide tray at this width. */
  .tb-center { display: flex; align-items: center; gap: 4px; height: 100%; padding-left: 6px; }
  .tb-btn { position: relative; width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; }
  .tb-btn svg { width: 24px; height: 24px; display: block; }
  .tb-btn.active { background: var(--hover); }
  .tb-btn.run::after, .tb-btn.active::after { content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 6px; height: 3px; border-radius: 2px; background: var(--run); }
  .tb-btn.active::after { width: 16px; background: var(--focus); }
  .tb-search { height: 34px; width: 214px; margin: 0 2px; border-radius: 17px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; }
  .dark .tb-search { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.07); color: rgba(255, 255, 255, 0.78); }
  .light .tb-search { background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(0, 0, 0, 0.06); color: rgba(0, 0, 0, 0.62); }
  .tb-search svg { width: 16px; height: 16px; }
  .tb-tray { margin-left: auto; display: flex; align-items: center; height: 100%; padding-right: 4px; }
  .tb-pill { height: 40px; border-radius: 4px; display: flex; align-items: center; gap: 10px; padding: 0 10px; }
  .tb-pill svg { width: 16px; height: 16px; display: block; fill: currentColor; }
  .tb-clock { text-align: right; line-height: 17px; padding: 0 6px 0 2px; }
  .strip-slot { margin: 0 2px; }

  .frame { position: absolute; overflow: hidden; border-radius: 8px; box-shadow: 0 32px 64px rgba(0, 0, 0, 0.45), 0 2px 21px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.07); }
  .light .frame { box-shadow: 0 32px 64px rgba(0, 0, 0, 0.18), 0 2px 21px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06); }
  .frame.bare { box-shadow: none; border-radius: 0; }
  .frame.clipped { -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent); mask-image: linear-gradient(to bottom, #000 82%, transparent); }
  .frame iframe { position: absolute; border: 0; background: transparent; }

  /* Copy sits on the canvas, outside the scaled desktop, so it stays crisp at any size. */
  .copy { position: absolute; left: 112px; top: 150px; width: 760px; }
  .copy.center { left: 0; right: 0; width: auto; text-align: center; top: 96px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 44px; }
  .center .brand { justify-content: center; margin-bottom: 28px; }
  .brand svg { width: 48px; height: 48px; }
  h1 { margin: 0; font-size: 76px; line-height: 1.04; font-weight: 600; letter-spacing: -0.025em; }
  .center h1 { font-size: 68px; }
  h1 em { font-style: normal; background: linear-gradient(100deg, #f4a184 0%, var(--accent) 45%, var(--accent-deep) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .light h1 em { background: linear-gradient(100deg, #e07a5f 0%, #c24f37 60%, #a63d28 100%); -webkit-background-clip: text; background-clip: text; }
  p.sub { margin: 28px 0 0; font: 400 26px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--ink-soft); max-width: 640px; }
  .center p.sub { margin-left: auto; margin-right: auto; max-width: 980px; margin-top: 20px; }
  .note { margin-top: 44px; display: flex; align-items: center; gap: 18px; font: 400 20px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--ink-soft); }
  .note::before { content: ""; width: 44px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, var(--accent), var(--accent-deep)); }

  .closeup { position: absolute; left: 0; right: 0; top: 560px; height: 120px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 38%); mask-image: linear-gradient(to right, transparent 0, #000 38%); }
  .closeup .taskbar { left: auto; right: 0; bottom: auto; top: 0; width: 1536px; transform: scale(2.5); transform-origin: 100% 0; }
</style>
</head>
<body>
<div class="wall"><i></i></div>
<script type="module">
// Everything below builds static markup from constants in this file; nothing comes from outside.
const params = new URLSearchParams(location.search);
const scene = Number(params.get("s") ?? 1);
const NOW = "2026-11-10T14:32:00";
const LOGO = `<svg viewBox="64 64 896 896" aria-hidden="true"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34302d"/><stop offset="1" stop-color="#1b1918"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e07a5f"/><stop offset="1" stop-color="#c24f37"/></linearGradient><linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c24f37"/><stop offset="1" stop-color="#f08d71"/></linearGradient></defs><rect x="64" y="64" width="896" height="896" rx="208" fill="url(#t)"/><rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="4"/><rect x="292" y="232" width="136" height="560" rx="68" fill="url(#p)"/><rect x="292" y="656" width="440" height="136" rx="68" fill="#fff" fill-opacity=".16"/><rect x="292" y="656" width="300" height="136" rx="68" fill="url(#f)"/><rect x="640" y="616" width="22" height="216" rx="11" fill="#fff" fill-opacity=".92"/></svg>`;

const url = (page, extra = {}) => {
  const q = new URLSearchParams({ scenario: "hot", theme: "dark", locale: "en", now: NOW, ...extra });
  return `/${page}.html?${q}&more`;
};

const el = (markup) => document.createRange().createContextualFragment(markup.trim()).firstElementChild;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** Embeds one window of the real interface and crops the frame to it. */
async function embed(parent, src, { left, top, right, bottom, height = 900, width = 380, select, tab, settings, bare, clip } = {}) {
  const frame = el(`<div class="frame${bare ? " bare" : ""}"></div>`);
  const iframe = el(`<iframe width="${width}" height="${height}"></iframe>`);
  iframe.src = src;
  frame.append(iframe);
  parent.append(frame);
  await new Promise((r) => iframe.addEventListener("load", r, { once: true }));
  const doc = iframe.contentDocument;
  // Chromium paints an iframe opaque when its colour scheme differs from the page around it.
  iframe.style.colorScheme = getComputedStyle(doc.documentElement).colorScheme || "normal";
  const style = doc.createElement("style");
  style.textContent = "html,body{background:transparent!important}";
  doc.head.append(style);
  for (let i = 0; i < 100 && !doc.querySelector(select); i++) await sleep(50);
  await sleep(300);
  if (tab !== undefined) { doc.querySelectorAll('[role="tab"]')[tab]?.click(); await sleep(400); }
  if (settings) { doc.querySelector('button[aria-label="Settings"]')?.click(); await sleep(600); }
  const target = doc.querySelector(select);
  iframe.style.colorScheme = getComputedStyle(doc.documentElement).colorScheme || "normal";
  const box = target.getBoundingClientRect();
  Object.assign(iframe.style, { left: `${-box.left}px`, top: `${-box.top}px` });
  Object.assign(frame.style, { width: `${box.width}px`, height: `${clip ? Math.min(clip, box.height) : box.height}px` });
  if (clip && box.height > clip) frame.classList.add("clipped");
  if (left !== undefined) frame.style.left = `${left}px`;
  if (right !== undefined) frame.style.right = `${right}px`;
  if (top !== undefined) frame.style.top = `${top}px`;
  if (bottom !== undefined) frame.style.bottom = `${bottom}px`;
  return { frame, box };
}

const ICONS = {
  start: `<svg viewBox="0 0 24 24"><defs><linearGradient id="win" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0ff"/><stop offset="1" stop-color="#0063c4"/></linearGradient></defs><g fill="url(#win)"><rect x="2" y="2" width="9.6" height="9.6" rx=".9"/><rect x="12.4" y="2" width="9.6" height="9.6" rx=".9"/><rect x="2" y="12.4" width="9.6" height="9.6" rx=".9"/><rect x="12.4" y="12.4" width="9.6" height="9.6" rx=".9"/></g></svg>`,
  search: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="9.5" cy="6.5" r="4.5"/><path d="M6.2 9.8L2 14" stroke-linecap="round"/></svg>`,
  taskView: `<svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="12" rx="2.2" fill="#8c8c8c"/><rect x="9" y="4" width="12" height="12" rx="2.2" fill="#f2f2f2" stroke="#9a9a9a" stroke-width=".8"/></svg>`,
  explorer: `<svg viewBox="0 0 24 24"><defs><linearGradient id="fx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd25c"/><stop offset="1" stop-color="#f4b324"/></linearGradient></defs><path d="M2.5 6A1.5 1.5 0 0 1 4 4.5h5.2l2 2H20A1.5 1.5 0 0 1 21.5 8v1.5h-19z" fill="#e3a21a"/><path d="M2.5 8.5h19V18a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18z" fill="url(#fx)"/><rect x="2.5" y="15.5" width="19" height="4" rx="1.4" fill="#2f86e8"/></svg>`,
  terminal: `<svg viewBox="0 0 24 24"><rect x="2" y="3.5" width="20" height="17" rx="2.6" fill="#2b2b2b" stroke="#585858" stroke-width=".8"/><rect x="2" y="3.5" width="20" height="3.6" rx="2" fill="#3b3b3b"/><path d="M6 11l3.2 2.4L6 15.8" fill="none" stroke="#e6e6e6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 16h6" stroke="#e6e6e6" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  notepad: `<svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2" fill="#2f7fd8"/><rect x="5.5" y="5.5" width="13" height="14.5" rx="1" fill="#f7f9fc"/><path d="M8 9.5h8M8 12.5h8M8 15.5h5" stroke="#9ab3d1" stroke-width="1.1" stroke-linecap="round"/></svg>`,
  settings: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.6" fill="none" stroke="#8f9aa6" stroke-width="3.4" stroke-dasharray="3 2.97"/><circle cx="12" cy="12" r="6.3" fill="#8f9aa6"/><circle cx="12" cy="12" r="2.6" fill="#e9eef3"/></svg>`,
  calculator: `<svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2.4" fill="#3a3a3a"/><rect x="6" y="4.5" width="12" height="4" rx="1" fill="#6c6c6c"/><g fill="#9a9a9a"><rect x="6" y="10.5" width="3.2" height="2.6" rx=".6"/><rect x="10.4" y="10.5" width="3.2" height="2.6" rx=".6"/><rect x="6" y="14.5" width="3.2" height="2.6" rx=".6"/><rect x="10.4" y="14.5" width="3.2" height="2.6" rx=".6"/></g><rect x="14.8" y="10.5" width="3.2" height="6.6" rx=".6" fill="#3a8ee6"/></svg>`,
  chev: `<svg viewBox="0 0 16 16" style="fill:none;stroke:currentColor;stroke-width:1.3"><path d="M4 10l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  wifi: `<svg viewBox="0 0 16 16"><path d="M8 13.6a1.1 1.1 0 1 0 0-2.2 1.1 1.1 0 0 0 0 2.2zM4.6 9.9a4.8 4.8 0 0 1 6.8 0l-.8.8a3.7 3.7 0 0 0-5.2 0zM2.5 7.8a7.8 7.8 0 0 1 11 0l-.8.8a6.6 6.6 0 0 0-9.4 0zM.4 5.7a10.8 10.8 0 0 1 15.2 0l-.8.8a9.6 9.6 0 0 0-13.6 0z"/></svg>`,
  sound: `<svg viewBox="0 0 16 16"><path d="M8.5 2.3v11.4a.6.6 0 0 1-1 .4L4.4 11H2.2A1.2 1.2 0 0 1 1 9.8V6.2A1.2 1.2 0 0 1 2.2 5h2.2l3.1-3.1a.6.6 0 0 1 1 .4zM10.6 5.2a4 4 0 0 1 0 5.6l-.7-.7a3 3 0 0 0 0-4.2zM12.4 3.4a6.6 6.6 0 0 1 0 9.2l-.7-.7a5.6 5.6 0 0 0 0-7.8z"/></svg>`,
  battery: `<svg viewBox="0 0 16 16"><path d="M3 4.5h9A1.5 1.5 0 0 1 13.5 6v4A1.5 1.5 0 0 1 12 11.5H3A1.5 1.5 0 0 1 1.5 10V6A1.5 1.5 0 0 1 3 4.5zm0 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V6a.5.5 0 0 0-.5-.5zM14.3 6.8h.5a.4.4 0 0 1 .4.4v1.6a.4.4 0 0 1-.4.4h-.5z"/><rect x="3.4" y="6.4" width="6.4" height="3.2" rx=".4"/></svg>`,
  bell: `<svg viewBox="0 0 16 16"><path d="M8 1.5a4.3 4.3 0 0 1 4.3 4.3v2.6l1.1 2.2a.6.6 0 0 1-.5.9H3.1a.6.6 0 0 1-.5-.9l1.1-2.2V5.8A4.3 4.3 0 0 1 8 1.5zm0 1a3.3 3.3 0 0 0-3.3 3.3v2.8l-.9 1.8h8.4l-.9-1.8V5.8A3.3 3.3 0 0 0 8 2.5zM6.3 12.5h3.4a1.7 1.7 0 0 1-3.4 0z"/></svg>`,
};

/** Start, search and Task View, then pinned apps: `run` is open, `active` has focus. */
const PINNED = [["explorer", "run"], ["terminal", "active"], ["notepad", ""], ["settings", "run"], ["calculator", ""]];

const tray = () =>
  `<div class="tb-tray"><div class="tb-pill">${ICONS.chev}</div><div class="strip-slot"></div><div class="tb-pill">${ICONS.wifi}${ICONS.sound}${ICONS.battery}</div><div class="tb-clock">2:32 PM<br>11/10/2026</div><div class="tb-pill">${ICONS.bell}</div></div>`;

const taskbarMarkup = () =>
  `<div class="taskbar"><div class="tb-center"><div class="tb-btn">${ICONS.start}</div><div class="tb-search">${ICONS.search}Search</div><div class="tb-btn">${ICONS.taskView}</div>${PINNED.map(([icon, state]) => `<div class="tb-btn ${state}">${ICONS[icon]}</div>`).join("")}</div>${tray()}</div>`;

function taskbar(stage) {
  const bar = el(taskbarMarkup());
  stage.append(bar);
  return bar;
}

async function stripInto(slot, extra = {}) {
  slot.style.cssText = "position:relative;height:40px;";
  const { box } = await embed(slot, url("strip", extra), { select: ".strip", width: 700, height: 48, bare: true, left: 0, top: 0 });
  slot.style.width = `${box.width}px`;
}

function copy({ center, title, sub, note }) {
  const line = note ? `<p class="note">${note}</p>` : "";
  document.body.append(el(`<div class="copy${center ? " center" : ""}"><div class="brand">${LOGO}Limvo</div><h1>${title}</h1><p class="sub">${sub}</p>${line}</div>`));
}

function desktop(theme) {
  document.body.className = theme;
  const stage = el(`<div class="stage"></div>`);
  document.body.append(stage);
  return stage;
}

const SCENES = {
  // The hero: the reading next to the clock and the flyout above it.
  async 1() {
    const stage = desktop("dark");
    copy({ title: "Your AI limits, <em>right next to the clock.</em>", sub: "Claude, Codex, Cursor and Antigravity in the Windows taskbar, with the pace you are using them at.", note: "Free and open source. No account, no telemetry." });
    const bar = taskbar(stage);
    await stripInto(bar.querySelector(".strip-slot"));
    await embed(stage, url("index"), { select: ".flyout", tab: 0, right: 12, bottom: 60 });
  },
  // The forecast, in the light theme.
  async 2() {
    const stage = desktop("light");
    copy({ title: "Know when a limit runs out. <em>Before it does.</em>", sub: "Limvo projects your usage to the reset and tells you whether you are on track, tight or running hot." });
    const bar = taskbar(stage);
    await stripInto(bar.querySelector(".strip-slot"), { theme: "light" });
    await embed(stage, url("index", { theme: "light" }), { select: ".flyout", tab: 0, right: 12, bottom: 60 });
  },
  // The taskbar reading, up close: the right end of a real taskbar, magnified.
  async 3() {
    desktop("dark");
    copy({ center: true, title: "Up to six limits, <em>on every taskbar.</em>", sub: "Pin the limits you care about. They sit next to the clock on every monitor, and a click opens the details." });
    const band = el(`<div class="closeup">${taskbarMarkup()}</div>`);
    document.body.append(band);
    await stripInto(band.querySelector(".strip-slot"));
  },
  // Every service side by side.
  async 4() {
    desktop("dark");
    copy({ center: true, title: "Every plan. <em>One glance.</em>", sub: "Each service gets its own tab, logo, plan badge and colour." });
    const row = el(`<div style="position:absolute;left:0;right:0;top:390px;height:700px"></div>`);
    document.body.append(row);
    const lefts = [96, 538, 980, 1422];
    await Promise.all([0, 1, 2, 3].map((tab, i) => embed(row, url("index", { scenario: "reference" }), { select: ".flyout", tab, left: lefts[i], top: 0 })));
  },
  // Settings and the desktop card.
  async 5() {
    const stage = desktop("dark");
    copy({ title: "Make it <em>yours.</em>", sub: "Pin the limits you want in the taskbar, keep a card on the desktop, pick the language and how often Limvo refreshes." });
    const bar = taskbar(stage);
    await stripInto(bar.querySelector(".strip-slot"));
    await embed(stage, url("index", { scenario: "reference" }), { select: ".flyout", tab: 0, right: 12, bottom: 60, settings: true, height: 1600, clip: 690 });
    await embed(stage, url("card", { scenario: "reference" }), { select: "#root > *", left: 90, top: 470, width: 340, height: 220 });
  },
  // Languages.
  async 6() {
    desktop("light");
    copy({ center: true, title: "Speaks <em>eleven languages.</em>", sub: "Including right-to-left Hebrew. It follows your Windows language." });
    const row = el(`<div style="position:absolute;left:0;right:0;top:340px;height:740px"></div>`);
    document.body.append(row);
    await Promise.all([
      embed(row, url("index", { locale: "pl", theme: "light" }), { select: ".flyout", tab: 0, left: 300, top: 0 }),
      embed(row, url("index", { locale: "he", theme: "dark", scenario: "reference" }), { select: ".flyout", tab: 0, left: 770, top: 0 }),
      embed(row, url("index", { locale: "ja", theme: "light", scenario: "tight" }), { select: ".flyout", tab: 0, left: 1240, top: 0 }),
    ]);
  },
};

await SCENES[scene]();
await sleep(1500);
document.title = "ready";
</script>
</body>
</html>
