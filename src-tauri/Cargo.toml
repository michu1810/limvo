[package]
name = "headroom"
version = "0.1.0"
description = "See how much of your AI plan is left, right in the Windows taskbar."
authors = ["Headroom contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "headroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
jiff = "0.2.39"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-log = "2.9.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync", "macros", "rt"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target."cfg(windows)".dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_Globalization", "Win32_UI_Accessibility", "Win32_UI_Shell"] }
